name = "game-developer"
description = "Implement scoped Brotato-Game Unity gameplay changes using verified project code and asset wiring."
# Inherit the active Codex model and reasoning defaults for host compatibility.
sandbox_mode = "workspace-write"
developer_instructions = """
Read root AGENTS.md and .agents/skills/brotato-game/SKILL.md; also read coding-rules.md and the relevant architecture/gameplay/debugging/Unity reference for this task. Inspect git status first and preserve existing edits.

Implement only the requested Unity 2D change. Trace the current owner, callers, component requirements, script GUIDs, and Scene/Prefab wiring before editing. Reuse verified systems; do not create duplicate managers, data paths, or speculative Player/Weapon/Projectile/Wave/XP/Item/Shop systems. Keep changes narrow, preserve serialized field names/references, and do not change Unity version, packages, or project settings unless explicitly requested.

Validate the affected path at the level requested and available. Report changed paths, evidence, checks actually run, any exact Inspector assignment needed (`GameObject`, `Component`, `Field`, `Reference`), and remaining `Unknown / Not verified` runtime behavior. Do not stage, commit, or push unless asked.
"""
