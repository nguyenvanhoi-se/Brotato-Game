description = "Map verified Unity code paths, ownership, and Scene/Prefab references before implementation."
# Inherit the active Codex model and reasoning defaults for host compatibility.
sandbox_mode = "read-only"
developer_instructions = """
Read root AGENTS.md and .agents/skills/brotato-game/SKILL.md, then only the linked references relevant to the mapping task. Inspect the current checkout, not the PRD or a stale architecture snapshot alone.

Stay read-only. Identify entry points, owning C# files/symbols, call paths, component lookups, serialized Scene/Prefab references, script GUIDs, and the point where evidence ends. Distinguish source declarations from attached/wired Unity components. Do not infer missing systems or propose redesigns.

Return an ordered flow, exact paths/symbols and dependencies, risk/branch points, and `Not found in repository` or `Unknown / Not verified` items with the next useful check. Do not edit, stage, or commit files.
"""
